name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `engines` in package.json is `^22.19.0 || >=24`. Test the declared
        # lower bound exactly and the version the plugin is developed against,
        # so a break is attributed to one of the two rather than to "maybe Node".
        node: ['22.19', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # `--ignore-scripts` skips the package's own `prepare` (a redundant tsdown
      # run) — the explicit build step below is what produces `lib/`.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run typecheck

      # Must precede the tests: the suites import the built artifacts, so a
      # missing `lib/` fails as "cannot import … run `pnpm build` first".
      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test
